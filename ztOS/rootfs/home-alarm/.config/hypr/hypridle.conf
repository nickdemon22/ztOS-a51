# hypridle under ztMETRO (it speaks ext-idle-notify-v1, which the shell
# provides). Nothing here polls: hypridle sleeps until the compositor tells it
# the phone has been idle, or is in use again.
#
# zrnsensord follows the room all the time the screen is on (the sensor hub
# pushes its readings). AutoBrightness, reading the same sensor through
# ALS_IIO_ROOT in its .env, is run once more when the phone is picked up again
# and after a short idle, as on the laptop; only while auto brightness is on.
general {
    ignore_dbus_inhibit = true
}

listener {
    timeout = 20
    on-timeout = grep -qs auto=on /run/zrn-sensors/status && cd ~/AutoBrightnessLinux && build/autobrightness.dist/autobrightness
    on-resume = grep -qs auto=on /run/zrn-sensors/status && cd ~/AutoBrightnessLinux && build/autobrightness.dist/autobrightness
}
