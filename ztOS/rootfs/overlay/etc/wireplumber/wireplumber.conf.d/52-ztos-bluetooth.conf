# Bluetooth audio on the Galaxy S9 (bluetooth/README.md). The controller's
# UART runs at 3 Mbaud, so every codec fits, LDAC at its top rate included.
# Codecs in order of preference: the best one a headset also offers is used.
monitor.bluez.properties = {
  bluez5.codecs = [ ldac aptx_hd aptx aac sbc_xq sbc lc3 opus_05 faststream ]
  bluez5.enable-sbc-xq = true
  bluez5.enable-msbc = true
  bluez5.enable-hw-volume = true
  bluez5.hfphsp-backend = "native"
  bluez5.roles = [ a2dp_sink a2dp_source bap_sink bap_source hfp_hf hfp_ag hsp_hs hsp_ag ]
}

monitor.bluez.rules = [
  {
    matches = [ { device.name = "~bluez_card.*" } ]
    actions = {
      update-props = {
        # high quality (990 kbit/s) instead of adaptive: the link has room
        bluez5.a2dp.ldac.quality = "hq"
        bluez5.a2dp.aac.bitratemode = 5
        # straight to music, not the call profile
        bluez5.auto-connect = [ a2dp_sink hfp_hf hsp_hs ]
        device.profile = "a2dp-sink"
      }
    }
  }
]
